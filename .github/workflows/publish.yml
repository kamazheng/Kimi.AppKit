name: publish

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace }}/nuget

defaults:
  run:
    shell: bash

jobs:
  create_nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ 不可省。MinVer 靠 git tag 推导版本号，浅克隆下它看不到任何 tag，
          #    会**静默**把所有包打成 0.0.0-alpha.0——构建全绿、包却是废的。
          #    tests/PackagingTests 里有一条断言专门守这个。
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet pack Kimi.AppKit.slnx -c Release -o "${{ env.NuGetDirectory }}"

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.NuGetDirectory }}/*

  validate_nuget:
    runs-on: ubuntu-latest
    needs: [create_nuget]
    steps:
      - uses: actions/setup-dotnet@v4
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - run: dotnet tool install --global Meziantou.Framework.NuGetPackageValidation.Tool

      # 排除的规则，每条都有理由——不要为了让 CI 变绿而随手往这里加：
      #   119 作者与所有者相同 —— 个人仓库天然如此
      #    52 仓库 URL 不可访问 —— 仓库当前是 private，校验器拿到 404。
      #       ⚠️ 包本身是要发到公开 nuget.org 的，仓库转 public 后应删掉这条豁免，
      #          否则会掩盖「RepositoryUrl 真的写错了」这类问题。
      - name: 校验包元数据
        run: |
          shopt -s nullglob
          for pkg in "${{ env.NuGetDirectory }}"/*.nupkg; do
            meziantou.validate-nuget-package "$pkg" --excluded-rule-ids 119,52
          done

  run_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # 依赖图断言：ImageSharp / NPOI 已整体移出依赖图（2.x 全线有未修复公告、2.8+ 与 4.x 许可不可接受）。
      # restore 不带任何审计绕过——审计公告在 TreatWarningsAsErrors 下会直接让 restore 失败。
      - name: 依赖图断言（无 ImageSharp / NPOI，restore 审计通过）
        run: |
          dotnet restore Kimi.AppKit.slnx --force
          hits=$(dotnet list Kimi.AppKit.slnx package --include-transitive | grep -ciE 'imagesharp|npoi' || true)
          if [ "$hits" != "0" ]; then
            echo "::error::依赖图里出现 ImageSharp/NPOI（$hits 处）"
            dotnet list Kimi.AppKit.slnx package --include-transitive | grep -iE 'imagesharp|npoi'
            exit 1
          fi

      # 死选项扫描：public 可写 Options 属性除定义处外 0 引用 = 配置项被删了逻辑却留着（假配置开关）。
      - name: 死选项扫描（先自检，再扫 src）
        run: |
          scripts/dead-options-scan.sh --self-test
          scripts/dead-options-scan.sh

      # ⚠️ 这一步不允许 continue-on-error。
      #    参考教训：Kimi.MudBlazorExtentions 的 CI 里 run_test 跑的是一个 10 行的空 [Fact]，
      #    于是历次发布实质上没有任何自动化验证。gate 必须是真的。
      - name: 包的回归测试（单元测试，不含双 provider 集成测试）
        run: dotnet test Kimi.AppKit.slnx -c Release --filter "FullyQualifiedName!~IntegrationTests"

      - name: 样例工程构建与测试
        run: dotnet test samples/AppTemplate.Next/KMoldApp.sln -c Release

  integration_test:
    # ubuntu-latest 自带 Docker，Testcontainers 用它拉起真实的 PostgreSQL / SQL Server 容器。
    # 这条 gate 存在的意义：SQLite 单元测试验证逻辑正确，但测不出两个 provider 的真实分歧
    # （尤其 UTC 时区归一——必须连真正的 Npgsql 驱动才能验证 timestamptz 的 offset 限制）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: 双 provider 集成测试
        run: dotnet test tests/Kimi.AppKit.IntegrationTests -c Release

  deploy:
    # 只有发 GitHub Release 才真正推包。push / PR 只做打包、校验与测试。
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [validate_nuget, run_test, integration_test]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}
      - uses: actions/setup-dotnet@v4

      - name: 推送到 nuget.org
        run: |
          shopt -s nullglob
          for pkg in "${{ env.NuGetDirectory }}"/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "${{ secrets.NUGET_APIKEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
